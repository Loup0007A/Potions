<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SID Quest — Épreuves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#12152E;--nuit2:#1A1E40;--nuit3:#262B58;--trait:#363D72;
  --texte:#EEF0FF;--doux:#A5AAD8;--pale:#6E74A8;
  --vert:#3FD2A6;--soufre:#F5C842;--uv:#A890FF;--rouge:#FF6B6B;
  --acc:#C9CCF7;
}
body[data-e="1"]{--acc:var(--vert)}
body[data-e="2"]{--acc:var(--soufre)}
body[data-e="3"]{--acc:var(--uv)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--nuit);color-scheme:dark}
body{min-height:100vh;color:var(--texte);font:16px/1.6 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 520px at 50% -240px,color-mix(in srgb,var(--acc) 20%,transparent),transparent 72%) no-repeat,var(--nuit)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hidden{display:none!important}

/* Barre */
.barre{display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,40px);position:sticky;top:0;z-index:10;
  background:color-mix(in srgb,var(--nuit) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--trait) 55%,transparent)}
.marque{font:800 16px/1 Unbounded,sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.marque::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.fil{display:flex;gap:8px;align-items:center;color:var(--doux);font-size:14px;flex-wrap:wrap;min-width:0}
.fil a{text-decoration:none}.fil a:hover{color:var(--texte)}
.fil .sep{color:var(--pale)}
.compte{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--doux);min-width:0}
.compte span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw}
.compte button{background:none;border:0;color:var(--acc);font:600 14px Figtree,sans-serif;cursor:pointer;padding:4px}
@media(max-width:560px){.compte span{display:none}}
.accueil-mail{max-width:560px;margin:4vh auto 0}
.accueil-mail form.rep{margin-top:30px}
.accueil-mail .mal{display:block;margin-top:12px;min-height:1.6em}
.chrono{margin-left:auto;font:700 15px/1 Unbounded,sans-serif;font-variant-numeric:tabular-nums;padding:9px 14px;border-radius:999px;background:var(--nuit2);border:1px solid var(--trait)}
.chrono.alerte{color:var(--rouge);border-color:var(--rouge)}

main{max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,40px) 80px}
h1{font:800 clamp(32px,6vw,62px)/1.04 Unbounded,sans-serif;letter-spacing:-.02em}
h2{font:700 19px/1.25 Unbounded,sans-serif;letter-spacing:-.01em}
.chapo{color:var(--doux);font-size:clamp(16px,1.6vw,18px);max-width:62ch;margin-top:18px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 15px/1 Figtree,sans-serif;padding:14px 22px;border-radius:999px;background:var(--acc);color:var(--nuit);text-decoration:none;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.second{background:transparent;color:var(--texte);box-shadow:inset 0 0 0 1.5px var(--trait)}
.btn.second:hover{box-shadow:inset 0 0 0 1.5px var(--acc)}
.btn.petit{padding:9px 14px;font-size:14px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

/* Accueil */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;margin-top:52px}
.epreuve{display:flex;flex-direction:column;gap:20px;text-decoration:none;background:var(--nuit2);border:1px solid var(--trait);border-radius:24px;padding:22px;transition:border-color .2s}
.epreuve:hover{border-color:var(--acc)}
.epreuve p{color:var(--doux);margin-top:8px;font-size:15px}
.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;padding:18px;border-radius:16px;background:var(--nuit)}
.mini i{aspect-ratio:1;border-radius:50%;background:var(--nuit3)}
.mini i.ok{background:var(--acc);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 55%,transparent)}
.mini i.suiv{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.pied{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--doux);margin-top:auto}
.ouvrir{color:var(--acc);font-weight:700}
.cd{color:var(--rouge)}

/* Carte des niveaux */
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.etat{display:grid;gap:8px;min-width:min(320px,100%);color:var(--doux);font-size:14px}
.jauge{height:8px;border-radius:9px;background:var(--nuit3);overflow:hidden}
.jauge i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bandeau{margin-top:28px;padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--rouge) 9%,var(--nuit2));border:1px solid color-mix(in srgb,var(--rouge) 45%,transparent);color:#FFD3D3}
.carte{position:relative;aspect-ratio:1;max-width:760px;margin:44px auto 0}
.carte svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.noeud{position:absolute;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  font:700 clamp(9px,1.45vw,14px)/1 Unbounded,sans-serif;text-decoration:none;background:var(--nuit2);border:1.5px solid var(--trait);color:var(--pale);transition:transform .15s}
.noeud.palier{width:8.6%;border-width:2.5px}
.noeud.ok{background:var(--acc);border-color:var(--acc);color:var(--nuit)}
.noeud.libre{color:var(--texte);border-color:color-mix(in srgb,var(--acc) 55%,var(--trait))}
.noeud.ouvert{border-color:var(--acc);color:var(--texte);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 22%,transparent)}
a.noeud:hover{transform:translate(-50%,-50%) scale(1.14)}
.legende{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;color:var(--doux);font-size:13px;margin-top:26px}
.legende span{display:inline-flex;align-items:center;gap:7px}
.legende i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--trait);background:var(--nuit2)}
.legende i.ok{background:var(--acc);border-color:var(--acc)}
.legende i.ouvert{border-color:var(--acc)}

/* Intro de niveau */
.nv-tete{display:flex;align-items:flex-end;gap:clamp(18px,4vw,44px);flex-wrap:wrap}
.gros{font:800 clamp(96px,19vw,210px)/.8 Unbounded,sans-serif;color:var(--acc);letter-spacing:-.05em}
.nv-tete h1{font-size:clamp(26px,4vw,40px)}
.nv-tete p{color:var(--doux);margin-top:6px}
.diff{display:flex;gap:4px;margin-top:14px}
.diff i{width:18px;height:6px;border-radius:4px;background:var(--nuit3)}
.diff i.on{background:var(--acc)}
.fiche{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:44px}
@media(max-width:760px){.fiche{grid-template-columns:1fr}}
.bloc{background:var(--nuit2);border:1px solid var(--trait);border-radius:20px;padding:24px}
.bloc h2{font-size:16px;margin-bottom:14px}
.bloc.danger{background:color-mix(in srgb,var(--rouge) 7%,var(--nuit2));border-color:color-mix(in srgb,var(--rouge) 45%,transparent)}
.puces{list-style:none;display:grid;gap:9px}
.puces li{padding-left:22px;position:relative;color:#D9DCF6}
.puces li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.danger .puces li::before{background:var(--rouge)}

/* Potions */
.labo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
@media(max-width:860px){.labo{grid-template-columns:1fr}}
.cibles{list-style:none;display:grid;gap:10px}
.cibles li{background:var(--nuit);border:1px solid var(--trait);border-radius:14px;padding:12px 14px}
.cibles li.ok{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--nuit))}
.cn{font-weight:700;display:flex;justify-content:space-between;gap:10px}
.cn small{font-weight:500;color:var(--pale);font-size:12px;white-space:nowrap}
.cibles li.ok .cn span::before{content:"✓ ";color:var(--acc)}
.cr{color:var(--doux);font-size:14px;margin-top:3px}
.revele{font-size:13px;color:var(--acc);margin-top:6px}
details.carnet{margin-top:16px;border-top:1px solid var(--trait);padding-top:14px}
details.carnet summary{cursor:pointer;font-weight:700}
details.carnet ul{padding-left:18px;margin-top:10px;display:grid;gap:6px;font-size:14px;color:#D2D5F2}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.ing{background:var(--nuit);border:1.5px solid var(--trait);border-radius:14px;padding:10px 12px;text-align:left;color:var(--texte);cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.ing b{font:700 15px/1.3 Unbounded,sans-serif}
.ing span{font-size:12px;color:var(--doux);line-height:1.3}
.ing.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--nuit))}
.ing.inst{border-style:dashed}.ing.inst b{color:var(--uv)}
.ing:disabled{opacity:.35;cursor:not-allowed}
.chaudron{margin:18px 0 12px;padding:16px;border-radius:18px;background:radial-gradient(120% 150% at 50% 130%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 62%),var(--nuit);border:1px solid var(--trait)}
.cz{font:600 15px/1.5 Unbounded,sans-serif;min-height:26px;margin-bottom:14px;color:var(--acc)}
.cz.vide{color:var(--pale);font-family:Figtree,sans-serif;font-weight:500}
.res{min-height:52px}
.ptag{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--trait);margin:3px 5px 3px 0;font-size:13px;background:var(--nuit)}
.bon{color:var(--acc);font-weight:700;margin-bottom:4px}
.rien{color:var(--doux);margin-bottom:4px}
.mal{color:var(--rouge)}
.stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--doux);font-size:14px;margin-top:10px}
.stats .btn{margin-left:auto}
.journal{list-style:none;margin-top:14px;max-height:240px;overflow:auto;font-size:13px;color:var(--doux)}
.journal li{padding:7px 0;border-top:1px solid var(--trait)}
.journal b{color:var(--texte)}

/* Énigmes / problème */
.scene{max-width:740px;margin:0 auto}
.eh{display:flex;justify-content:space-between;gap:12px;color:var(--doux);font-size:14px;font-variant-numeric:tabular-nums}
.eh b{color:var(--texte);font:700 14px Unbounded,sans-serif}
.barre-t{height:6px;background:var(--nuit3);border-radius:9px;overflow:hidden;margin:12px 0 30px}
.barre-t i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.question{font:500 clamp(20px,2.8vw,27px)/1.42 Figtree,sans-serif;min-height:110px}
.enonce{font:500 clamp(19px,2.4vw,23px)/1.55 Figtree,sans-serif}
form.rep{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
form.rep input{flex:1 1 220px;background:var(--nuit);border:1.5px solid var(--trait);border-radius:999px;padding:14px 20px;color:var(--texte);font:600 17px Figtree,sans-serif;outline:none}
form.rep input:focus{border-color:var(--acc)}
.aide{color:var(--doux);font-size:14px;margin-top:16px}
textarea.brouillon{width:100%;min-height:200px;margin-top:22px;background:var(--nuit);border:1.5px solid var(--trait);border-radius:16px;padding:14px 16px;color:var(--texte);font:15px/1.6 Figtree,sans-serif;resize:vertical;outline:none}
textarea.brouillon:focus{border-color:var(--acc)}

/* Résultat */
.resultat{max-width:620px;margin:10px auto 0;text-align:center}
.resultat h1{font-size:clamp(28px,5vw,44px)}
.score{font:800 clamp(90px,18vw,150px)/1 Unbounded,sans-serif;letter-spacing:-.04em;margin:22px 0 6px;color:var(--acc)}
.score small{font-size:.28em;color:var(--pale);letter-spacing:0}
.resultat .actions{justify-content:center}
.resultat details{text-align:left;margin-top:30px;font-size:12px;color:var(--pale)}
.resultat code{display:block;word-break:break-all;background:var(--nuit2);padding:12px;border-radius:12px;margin-top:8px}

.boom{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(circle,rgba(255,215,120,.95),rgba(255,107,107,.65) 38%,transparent 72%);animation:boom .9s ease-out forwards}
@keyframes boom{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2.3)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!-- S.I.D. : synchronise la progression entre appareils quand le site est ouvert depuis le S.I.D. (sans effet sinon) -->
<script src="https://sid-quest.vercel.app/sid-sync.js" async></script>
</head>
<body>
<header class="barre">
  <a class="marque" data-nav="/" href="/">SID Quest</a>
  <nav class="fil" id="fil" aria-label="Fil d'Ariane"></nav>
  <div class="compte hidden" id="compte"></div>
  <div class="chrono hidden" id="timer" aria-live="off">60:00</div>
</header>
<main id="app"></main>

<script>
/* ===================== CONFIGURATION ===================== */
const CONFIG = {
  API_URL: "https://sid-quest.vercel.app/api",
  NB_NIVEAUX: 100,
  DUREE_MAX_MIN: 60,           // durée max d'une tentative
  COOLDOWN_MIN: 120,           // attente après chaque tentative, réussie ou non
  COOLDOWN_PORTEE: "epreuve",  // "epreuve" | "niveau" | "global"
  INVALIDER_SUR_BLUR: true,    // perte de focus = page quittée
  TOUT_DEBLOQUE: false,        // true = niveaux accessibles sans réussir le précédent
  ROUTAGE: "auto",             // "path" (/1/42), "hash" (#/1/42) ou "auto"
  BASE: "",                    // préfixe si le site n'est pas à la racine, ex. "/quest"
  SEL: "sid-quest-v2"
};
const NB = CONFIG.NB_NIVEAUX;
const RESERVES = ["email","epreuve","epreuve_num","niveau","statut","reussi","score","raison","details","session","debut","fin","duree_s","source","origine","parent","integre","ts","sig"];

/* ===================== OUTILS ===================== */
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const hm = ms => { const m = Math.ceil(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; };
const pl = (n, s, p = s + "s") => `${n} ${n > 1 ? p : s}`;
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? (mem[k] ?? null) : JSON.parse(v); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
const K_ACTIF = "sq_actif", K_EMAIL = "sq_email";
/* adresse e-mail du joueur */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const emailValide = v => EMAIL_RE.test(String(v || "").trim());
let EMAIL = (() => {
  const viaUrl = new URLSearchParams(location.search).get("email");
  if (emailValide(viaUrl)) { store.set(K_EMAIL, viaUrl.trim().toLowerCase()); }
  const v = store.get(K_EMAIL);
  return emailValide(v) ? v : "";
})();
/* progression et cooldown propres à chaque adresse */
const pfx = () => "sq_" + fnv(EMAIL) + "_";
const cdKey = (e, n) => pfx() + (CONFIG.COOLDOWN_PORTEE === "global" ? "cd_global" : CONFIG.COOLDOWN_PORTEE === "niveau" ? `cd_${e}_${n}` : `cd_${e}`);
const cooldown = (e, n) => Math.max(0, (store.get(cdKey(e, n)) || 0) - Date.now());
const prog = e => +(store.get(pfx() + "prog_" + e) || 0);
const debloque = (e, n) => CONFIG.TOUT_DEBLOQUE || n <= prog(e) + 1;

/* maths */
const modpow = (b, e, m) => { let r = 1n, B = BigInt(b) % BigInt(m), E = BigInt(e); const M = BigInt(m); while (E > 0n) { if (E & 1n) r = r * B % M; B = B * B % M; E >>= 1n; } return r; };
const pgcd = (a, b) => b ? pgcd(b, a % b) : a;
const nbDiv = n => { let c = 0; for (let i = 1; i * i <= n; i++) if (n % i === 0) c += i * i === n ? 1 : 2; return c; };
const estPremier = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const binom = (n, k) => { let r = 1n; for (let i = 1; i <= k; i++) r = r * BigInt(n - k + i) / BigInt(i); return r; };
const fact = n => { let r = 1n; for (let i = 2; i <= n; i++) r *= BigInt(i); return r; };
const josephus = (N, k) => { let j = 0; for (let n = 2; n <= N; n++) j = (j + k) % n; return j + 1; };

/* ===================== ROUTAGE ===================== */
function modeHash() {
  if (CONFIG.ROUTAGE === "hash") return true;
  if (CONFIG.ROUTAGE === "path") return false;
  return location.protocol === "file:" || /\.html?$/.test(location.pathname) || location.hash.startsWith("#/");
}
const lien = p => modeHash() ? "#" + p : CONFIG.BASE + p;
function aller(p) {
  if (modeHash()) { if (location.hash === "#" + p) rendre(); else location.hash = p; }
  else { history.pushState(null, "", CONFIG.BASE + p); rendre(); }
}
const SLUGS = { potions: 1, enigmes: 2, probleme: 3 };
function route() {
  const brut = modeHash() ? location.hash.replace(/^#/, "") : location.pathname.slice(CONFIG.BASE.length);
  const seg = brut.split("/").filter(s => s && s !== "index.html");
  if (!seg.length) return { vue: "accueil" };
  const e = SLUGS[seg[0]] || (/^[123]$/.test(seg[0]) ? +seg[0] : 0);
  if (!e) return { vue: "inconnu" };
  if (seg.length === 1) return { vue: "carte", e };
  const n = Number(seg[1]);
  if (seg.length === 2 && Number.isInteger(n) && n >= 1 && n <= NB) return { vue: "niveau", e, n };
  return { vue: "inconnu", e };
}
let ivVue = null;
function rendre() {
  clearInterval(ivVue);
  const r = route();
  document.body.dataset.e = r.e || "";
  majFil(r); majCompte();
  window.scrollTo(0, 0);
  if (!EMAIL) { $("#fil").innerHTML = ""; return vueEmail(); }
  if (r.vue === "accueil") vueAccueil();
  else if (r.vue === "carte") vueCarte(r.e);
  else if (r.vue === "niveau") vueIntro(r.e, r.n);
  else vueInconnu();
}
function majFil(r) {
  const f = $("#fil"); if (!r || r.vue === "accueil" || r.vue === "inconnu") { f.innerHTML = ""; return; }
  const E = EPREUVES[r.e];
  f.innerHTML = `<span class="sep">/</span><a data-nav="/${r.e}" href="${lien("/" + r.e)}">${E.court}</a>` + (r.n ? `<span class="sep">/</span><span>Niveau ${r.n}</span>` : "");
}
document.addEventListener("click", ev => {
  const a = ev.target.closest("a[data-nav]");
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button !== 0) return;
  ev.preventDefault(); aller(a.dataset.nav);
});
const surNavigation = () => { if (S && !S.fini) invalider("navigation", true); else rendre(); };
window.addEventListener("popstate", surNavigation);
window.addEventListener("hashchange", surNavigation);

/* ===================== TRANSMISSION ===================== */
function urlParent() {
  if (window === window.top) return "direct";
  try { if (document.referrer) return document.referrer; } catch (e) {}
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) return location.ancestorOrigins[0]; } catch (e) {}
  return "inconnu";
}
const envoyes = new Set();
let derniereUrl = "";
function envoyer(r) {
  if (envoyes.has(r.session)) return;
  envoyes.add(r.session);
  const p = new URLSearchParams();
  for (const [k, v] of new URLSearchParams(location.search)) if (!RESERVES.includes(k)) p.set(k, v);
  const data = {
    email: r.email || EMAIL,
    epreuve: EPREUVES[r.e].slug, epreuve_num: r.e, niveau: r.n,
    statut: r.statut, reussi: r.statut === "reussi" ? 1 : 0, score: r.score,
    raison: r.raison || "", details: r.details || "", session: r.session,
    debut: new Date(r.debut).toISOString(), fin: new Date(r.fin).toISOString(),
    duree_s: Math.round((r.fin - r.debut) / 1000),
    source: location.href, origine: location.origin, parent: urlParent(),
    integre: window === window.top ? 0 : 1, ts: Date.now()
  };
  for (const k in data) p.set(k, String(data[k]));
  const canon = [...p.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, v]) => k + "=" + v).join("&");
  p.set("sig", fnv(CONFIG.SEL + "|" + canon));
  const url = CONFIG.API_URL + "?" + p.toString();
  derniereUrl = url;
  try { fetch(url, { method: "GET", mode: "no-cors", keepalive: true, credentials: "omit" }).catch(() => { new Image().src = url; }); }
  catch (e) { new Image().src = url; }
  try { window.parent.postMessage({ type: "sid-quest-resultat", ...data, sig: p.get("sig"), url }, "*"); } catch (e) {}
}

const REGLES_MIN = [REGLES[0], REGLES[1], REGLES[11], REGLES[12], "Les autres lois de ce laboratoire sont à découvrir par l'expérience."];
const PHRASES = {
  acide: "mord la langue", basique: "glisse entre les doigts comme un savon", neutre: "n'a aucun penchant",
  "salée": "a le goût de la mer", "sucrée": "est douce comme le miel", effervescente: "danse en bulles",

};
const NOMS_A = ["Élixir", "Philtre", "Baume", "Teinture", "Essence", "Onguent", "Larme", "Sève", "Souffle", "Nectar", "Liqueur", "Brume"];
const NOMS_B = ["de l'aube", "du dragon", "des marées", "d'obsidienne", "du veilleur", "des fous", "de cendre", "d'argent", "du nord", "des abysses", "de minuit", "du héron", "des sables", "de l'orage", "du lierre", "des comètes"];

function analyser(set) {
  if (!set.has("h2o")) return null;
  const acide = set.has("vinaigre") || set.has("citrique");
  const base = set.has("bicar") || set.has("nh3");
  const t = [acide && !base ? "acide" : base && !acide ? "basique" : "neutre"];
  if (set.has("nacl") || (acide && base)) t.push("salée");
  if (set.has("sucre")) t.push("sucrée");
  const eff = set.has("bicar") && acide;
  if (eff) t.push("effervescente");
  if (set.has("nh3") && !acide) t.push("toxique");
  if (set.has("ethanol") && !eff) t.push(set.has("o2") ? "ardente" : "inflammable");
  if (set.has("cafeine")) t.push("stimulante");
  if (set.has("mi") && set.has("nu")) t.push("quantique");
  else { if (set.has("mi")) t.push("lumineuse"); if (set.has("nu")) t.push("flottante"); }
  return t;
}
const memeEnsemble = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function cfgPotions(L) {
  const nCibles = Math.min(9, 1 + Math.floor((L - 1) / 11));
  return {
    nCibles,
    minK: 2 + Math.floor(L / 34), maxK: Math.min(5, 3 + Math.floor(L / 25)),
    minTags: L > 75 ? 4 : L > 40 ? 3 : 2,
    pInst: L < 10 ? 0 : Math.min(0.65, L / 140),
    poetique: L > 15, lexique: L <= 55, carnetComplet: L <= 80,
    cachees: L >= 90 ? 2 : L >= 66 ? 1 : 0,
    essaisMax: L <= 30 ? Infinity : Math.max(3, Math.round(8 - (L - 30) / 14)) * nCibles
  };
}
function genererCibles(c) {
  const NORMAUX = ING.map(x => x.id).filter(id => !["h2o", "mi", "nu"].includes(id));
  const cibles = [], vus = new Set(), noms = new Set();
  for (let garde = 0; cibles.length < c.nCibles && garde < 8000; garde++) {
    const k = R(c.minK, c.maxK), set = new Set(["h2o"]);
    if (Math.random() < c.pInst) { const r = Math.random(); if (r < 0.4) set.add("mi"); else if (r < 0.8) set.add("nu"); else { set.add("mi"); set.add("nu"); } }
    const pool = shuffle([...NORMAUX]);
    while (set.size < k && pool.length) set.add(pool.pop());
    if (set.size > 5) continue;
    const tags = analyser(set), cle = [...tags].sort().join("|");
    if (tags.length < c.minTags || vus.has(cle)) continue;
    let nom; do nom = NOMS_A[R(0, NOMS_A.length - 1)] + " " + NOMS_B[R(0, NOMS_B.length - 1)]; while (noms.has(nom));
    noms.add(nom); vus.add(cle);
    const nbC = Math.min(c.cachees, tags.length - 2);
    const caches = shuffle([...tags]).slice(0, Math.max(0, nbC));
    cibles.push({ nom, tags, caches, enigme: enigmePotion(tags, c.poetique, caches) });
  }
  return cibles;
}
function enigmePotion(tags, poetique, caches) {
  const vis = shuffle(tags.filter(t => !caches.includes(t)));
  const sec = caches.length > 1 ? " Deux de ses propriétés restent secrètes." : caches.length ? " Une de ses propriétés reste secrète." : "";
  if (!poetique) return "Propriétés : " + vis.join(", ") + "." + sec;
  const ph = vis.map(t => PHRASES[t]);
  return "Elle " + (ph.length > 1 ? ph.slice(0, -1).join(", ") + " et " + ph[ph.length - 1] : ph[0]) + "." + sec;
}

const Potions = {

      const nbInst = [...st.sel].filter(id => id === "mi" || id === "nu").length;
      for (let k = 0; k < nbInst; k++) if (Math.random() < 0.01) {

        setTimeout(() => document.querySelector(".boom")?.remove(), 1000);
        return terminer({ statut: "explosion", score: score(), details: details(), raison: "explosion_Mi_Nu" });
      }
      const tags = analyser(st.sel);
      let html;
      if (!tags) html = `<span class="mal">Sans eau, le mélange reste une poudre inerte.</span>`;
      else {
        const i = cibles.findIndex((p, j) => !st.faites.has(j) && memeEnsemble(p.tags, tags));

      $("#journal").insertAdjacentHTML("afterbegin", `<li><b>${st.essais}.</b> ${formule} → ${tags ? tags.join(", ") : "poudre"}</li>`);
      $("#pst").textContent = `${st.faites.size} / ${cibles.length} potions`;
      $("#ess").textContent = max === Infinity ? pl(st.essais, "essai") : `${st.essais} / ${max} essais`;
      st.sel.clear(); majCz();
      if (st.faites.size === cibles.length) return setTimeout(() => terminer({ statut: "reussi", score: 100, details: details() }), 900);
      if (st.essais >= max) setTimeout(() => terminer({ statut: "echoue", score: score(), details: details(), raison: "essais_epuises" }), 900);

};

const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const eur = c => (c / 100).toFixed(2).replace(".", ",");
const Q = (q, ...a) => ({ q, a: a.map(String) });

const suite = (s, rep) => Q(`Complétez la suite : ${s.join(", ")}, ?`, rep);
const GEN = [
  { min: 1, f: d => { const a = R(2, 10 + Math.round(40 * d)), k = R(2, 5 + Math.round(20 * d)); return suite([0, 1, 2, 3, 4].map(i => a + i * k), a + 5 * k); } },
  { min: 1, max: 50, f: () => { const n = R(3, 9), M = R(20, 200); return Q(`${n} chats attrapent ${n} souris en ${n} minutes. Combien de chats faut-il pour attraper ${M} souris en ${M} minutes ?`, n); } },

  { min: 1, max: 40, f: () => { const k = R(3, 6); return Q(`Un tiroir contient, dans le noir, des chaussettes de ${k} couleurs différentes en grande quantité. Combien faut-il en sortir au minimum pour être certain d'avoir une paire de même couleur ?`, k + 1); } },
  { min: 1, f: d => { const f = R(5, 20 + Math.round(30 * d)), e = R(18, 40); return Q(`La somme des âges d'un père et de son fils est ${2 * f + e} ans. Le père a ${e} ans de plus que son fils. Quel âge a le fils ?`, f); } },
  { min: 1, f: d => { const j = R(0, 6), n = R(5, 30 + Math.round(600 * d)); return Q(`Nous sommes ${JOURS[j]}. Quel jour de la semaine serons-nous dans ${n} jours ?`, JOURS[(j + n) % 7]); } },
  { min: 1, max: 45, f: (d, fx) => fx.pop() },
  { min: 8, f: d => { const a = R(1, 5), r = R(2, 3 + Math.round(2 * d)); return suite([0, 1, 2, 3, 4].map(i => a * r ** i), a * r ** 5); } },
  { min: 10, f: d => { const a = R(1, 20 + Math.round(60 * d)), k = R(1, 4 + Math.round(6 * d)); const s = [a]; for (let i = 0; i < 4; i++) s.push(s[i] + k + i); return suite(s, s[4] + k + 4); } },
  { min: 15, f: d => { const n = R(5, 10 + Math.round(30 * d)); return Q(`${n} personnes se serrent toutes la main, chacune une seule fois avec chaque autre. Combien de poignées de main au total ?`, n * (n - 1) / 2); } },
  { min: 15, f: () => { const b = R(3, 40), e = 100 * R(1, 5); return Q(`Une raquette et une balle coûtent ensemble ${eur(e + 2 * b)} €. La raquette coûte ${eur(e)} € de plus que la balle. Combien coûte la balle, en centimes ?`, b); } },
  { min: 20, f: () => { const s = [R(1, 9), R(1, 9)]; while (s.length < 7) s.push(s[s.length - 1] + s[s.length - 2]); return suite(s, s[5] + s[6]); } },

function genererQuestions(L) {
  const { n } = cfgEnigmes(L), d = L / 100;
  const dispo = GEN.filter(g => g.min <= L && (g.max ?? 999) >= L);
  const poids = g => 1 + g.min * L / 2000;
  const usage = new Map(), qs = [], fx = shuffle([...FIXES]);
  for (let garde = 0; qs.length < n && garde < 2000; garde++) {
    let r = Math.random() * dispo.reduce((s, g) => s + poids(g), 0);
    const g = dispo.find(x => (r -= poids(x)) < 0) || dispo[0];
    const u = usage.get(g) || 0; if (u >= 2) continue;
    const q = g.f(d, fx); if (!q) continue;
    usage.set(g, u + 1); qs.push(q);
  }
  return qs;
}
function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/,/g, ".").trim()
    .replace(/[.!?]+$/, "").replace(/\s+/g, " ").replace(/^(le |la |l'|les |un |une |mon |son |c'est |il s'agit de )/, "").trim();
}
function correct(rep, attendues) {
  const r = norm(rep), num = /^-?\d+(\.\d+)?$/;
  return attendues.some(a => { const x = norm(a); return num.test(r) && num.test(x) ? Number(r) === Number(x) : r === x; });
}

  app.innerHTML = `
    <h1>Trois épreuves.<br>Cent niveaux chacune.</h1>
    <p class="chapo">Chaque niveau est plus difficile que le précédent et ne s'ouvre qu'après la réussite du niveau d'avant. Une tentative dure une heure au plus, puis il faut attendre ${CONFIG.COOLDOWN_MIN / 60} heures, réussie ou non. Quitter la page pendant une épreuve l'annule aussitôt.</p>
    <div class="trio">${[1, 2, 3].map(e => { const E = EPREUVES[e]; return `
      <a class="epreuve" data-nav="/${e}" href="${lien("/" + e)}" style="--acc:var(${E.couleur})">
        ${miniGrille(e)}
        <div><h2>${E.nom}</h2><p>${E.accroche}</p></div>
        <div class="pied"><span>${etatTexte(e)}</span><span class="cd" data-cd="${e}"></span><span class="ouvrir">Voir les niveaux</span></div>
      </a>`; }).join("")}</div>`;
  const maj = () => app.querySelectorAll("[data-cd]").forEach(el => { const r = cooldown(+el.dataset.cd, prog(+el.dataset.cd) + 1); el.textContent = r ? `Pause : ${hm(r)}` : ""; });
  maj(); ivVue = setInterval(maj, 15000);
}
function positions() {
  return Array.from({ length: NB }, (_, i) => { const row = Math.floor(i / 10), col = row % 2 ? 9 - i % 10 : i % 10; return [col * 10 + 5, row * 10 + 5]; });
}
function vueCarte(e) {
  const E = EPREUVES[e], p = prog(e), pos = positions();
  const ligne = pts => pts.map(([x, y]) => `${x},${y}`).join(" ");
  const noeuds = pos.map(([x, y], i) => {
    const n = i + 1, cls = [n % 10 === 0 ? "palier" : "", n <= p ? "ok" : n === p + 1 ? "ouvert" : CONFIG.TOUT_DEBLOQUE ? "libre" : ""].join(" ");
    const style = `left:${x}%;top:${y}%`;
    return debloque(e, n) ? `<a class="noeud ${cls}" style="${style}" data-nav="/${e}/${n}" href="${lien(`/${e}/${n}`)}" aria-label="Niveau ${n}">${n}</a>` : `<span class="noeud ${cls}" style="${style}" aria-label="Niveau ${n}, verrouillé">${n}</span>`;
  }).join("");
  app.innerHTML = `
    <div class="tete">
      <div><h1>${E.nom}</h1><p class="chapo">${E.desc}</p></div>
      <div class="etat"><div class="jauge"><i style="width:${p / NB * 100}%"></i></div><span>${etatTexte(e)}</span></div>
    </div>
    <div class="bandeau hidden" id="cdb"></div>
    <div class="carte">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <polyline points="${ligne(pos)}" fill="none" stroke="var(--trait)" stroke-width=".5" stroke-linejoin="round"/>
        ${p ? `<polyline points="${ligne(pos.slice(0, Math.min(NB, p + 1)))}" fill="none" stroke="var(--acc)" stroke-width=".7" stroke-linejoin="round"/>` : ""}
      </svg>
      ${noeuds}
    </div>
    <div class="legende"><span><i class="ok"></i>Réussi</span><span><i class="ouvert"></i>Prochain niveau</span><span><i></i>Verrouillé</span></div>`;
  const maj = () => { const r = cooldown(e, p + 1), b = $("#cdb"); if (!b) return; b.classList.toggle("hidden", !r); b.textContent = r ? `Prochaine tentative possible dans ${hm(r)}.` : ""; };
  maj(); ivVue = setInterval(maj, 15000);
}
function vueIntro(e, n) {
  const E = EPREUVES[e];
  const diff = `<div class="diff" aria-label="Difficulté ${Math.ceil(n / 10)} sur 10">${Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.ceil(n / 10) ? "on" : ""}"></i>`).join("")}</div>`;
  const tete = `<div class="nv-tete"><div class="gros">${n}</div><div><h1>${E.nom}</h1><p>Niveau ${n} sur ${NB}</p>${diff}</div></div>`;
  if (!debloque(e, n)) {
    app.innerHTML = `${tete}<div class="fiche"><div class="bloc"><h2>Niveau verrouillé</h2><p style="color:var(--doux)">Réussissez le niveau ${prog(e) + 1} pour avancer. Les niveaux s'ouvrent un par un.</p>
      <div class="actions"><a class="btn" data-nav="/${e}/${prog(e) + 1}" href="${lien(`/${e}/${prog(e) + 1}`)}">Aller au niveau ${prog(e) + 1}</a><a class="btn second" data-nav="/${e}" href="${lien("/" + e)}">Voir les niveaux</a></div></div></div>`;
    return;
  }
  app.innerHTML = `${tete}
    <div class="fiche">
      <div class="bloc"><h2>Ce qui vous attend</h2><ul class="puces">${E.mod.resume(n).map(x => `<li>${x}</li>`).join("")}</ul></div>
      <div class="bloc danger"><h2>Avant de commencer</h2><ul class="puces">
        <li>Changer d'onglet ou de fenêtre, cliquer hors de l'épreuve, réduire ou recharger la page l'annule aussitôt.</li>
        <li>Durée maximale : ${CONFIG.DUREE_MAX_MIN} minutes.</li>
        <li>Pause de ${CONFIG.COOLDOWN_MIN / 60} heures après la tentative, réussie ou non.</li>
      </ul></div>
    </div>
    <div class="actions"><button class="btn" id="go">Commencer le niveau ${n}</button><a class="btn second" data-nav="/${e}" href="${lien("/" + e)}">Voir les niveaux</a></div>
    <p class="aide" id="cdi"></p>`;
  $("#go").onclick = () => lancer(e, n);
  const maj = () => { const r = cooldown(e, n), b = $("#go"); if (!b) return; b.disabled = r > 0; $("#cdi").textContent = r ? `Prochaine tentative possible dans ${hm(r)}.` : ""; };
  maj(); ivVue = setInterval(maj, 15000);
}
const LIBELLES = {
  reussi: "Niveau réussi", echoue: "Niveau échoué", invalide: "Tentative annulée", explosion: "Le chaudron a explosé", temps_ecoule: "Temps écoulé"
};
function vueResultat(r) {
  clearInterval(ivVue);
  const exp = {
    invalide: "La page a été quittée pendant l'épreuve.",
    explosion: "Une molécule instable a explosé. L'expérience est arrêtée.",
    temps_ecoule: "L'heure est passée.",
    echoue: { mauvaise_reponse: "Une réponse était fausse.", temps_enigme_depasse: "Le temps de l'énigme est dépassé.", essais_epuises: "Tous les essais ont été utilisés.", tentatives_epuisees: "Les tentatives sont épuisées.", abandon_volontaire: "Vous avez arrêté l'épreuve." }[r.raison] || "",
    reussi: r.n < NB ? `Le niveau ${r.n + 1} est maintenant ouvert.` : "Vous avez terminé les cent niveaux."
  }[r.statut] || "";
  const bonne = (r.details.match(/bonne_reponse=([^;]+)/) || [])[1];
  const suiv = r.statut === "reussi" && r.n < NB;
  if (r.statut !== "reussi") document.body.dataset.e = r.e;
  app.innerHTML = `
    <div class="resultat">
      <h1>${LIBELLES[r.statut] || r.statut}</h1>
      <p class="chapo" style="margin-inline:auto">${EPREUVES[r.e].nom}, niveau ${r.n}. ${exp}${bonne && r.statut !== "invalide" ? ` La réponse attendue était ${bonne}.` : ""}</p>
      <div class="score" ${r.statut === "reussi" ? "" : 'style="color:var(--rouge)"'}>${r.score}<small> / 100</small></div>
      <p class="aide">Résultat transmis. Prochaine tentative dans ${hm(cooldown(r.e, r.n + (suiv ? 1 : 0)))}.</p>
      <div class="actions">
        ${suiv ? `<a class="btn" data-nav="/${r.e}/${r.n + 1}" href="${lien(`/${r.e}/${r.n + 1}`)}">Voir le niveau ${r.n + 1}</a>` : ""}
        <a class="btn ${suiv ? "second" : ""}" data-nav="/${r.e}" href="${lien("/" + r.e)}">Voir les niveaux</a>
        <a class="btn second" data-nav="/" href="${lien("/")}">Toutes les épreuves</a>
      </div>
      <details><summary>Données transmises</summary><code>${derniereUrl.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</code></details>
    </div>`;
}
function majCompte() {
  const c = $("#compte");
  if (!EMAIL || (S && !S.fini)) { c.classList.add("hidden"); return; }
  c.classList.remove("hidden");
  c.innerHTML = `<span title="${EMAIL}">${EMAIL}</span><button type="button" id="chg">Changer d'adresse</button>`;
  $("#chg").onclick = () => { EMAIL = ""; store.del(K_EMAIL); rendre(); };
}
function vueEmail() {
  document.body.dataset.e = "";
  app.innerHTML = `
    <div class="accueil-mail">
      <h1>Avant de commencer</h1>
      <p class="chapo">Indiquez votre adresse e-mail. Elle accompagne chacun de vos résultats et garde votre progression sur cet appareil.</p>
      <form class="rep" id="mf" novalidate>
        <input id="mi" type="email" inputmode="email" autocomplete="email" placeholder="vous@exemple.fr" aria-label="Adresse e-mail" required>
        <button class="btn">Continuer</button>
      </form>
      <span class="mal" id="me" aria-live="polite"></span>
    </div>`;
  $("#mi").focus();
  $("#mf").onsubmit = ev => {
    ev.preventDefault();
    const v = $("#mi").value.trim().toLowerCase();
    if (!emailValide(v)) { $("#me").textContent = "Cette adresse n'est pas valide. Exemple : prenom@domaine.fr"; return; }
    EMAIL = v; store.set(K_EMAIL, v); rendre();
  };
}
function vueInconnu() {
  app.innerHTML = `<h1>Page introuvable</h1><p class="chapo">Les adresses valides sont /1, /2 ou /3 pour la carte d'une épreuve, et /1/1 à /3/${NB} pour un niveau.</p>
    <div class="actions"><a class="btn" data-nav="/" href="${lien("/")}">Toutes les épreuves</a></div>`;
}
document.querySelector(".marque").setAttribute("href", lien("/"));
rendre();
</script>
</body>
</html>
